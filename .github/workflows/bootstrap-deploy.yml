name: Publish simplified Weibo network atlas

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/site-v2/**'
      - '.github/workflows/bootstrap-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-weibo-atlas
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify the prepared site
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap/site-v2
          parts=(
            .bootstrap/site-v2/part-00
            .bootstrap/site-v2/part-01
            .bootstrap/site-v2/part-02a
            .bootstrap/site-v2/part-02b
            .bootstrap/site-v2/part-02c
            .bootstrap/site-v2/part-02d
            .bootstrap/site-v2/part-03
            .bootstrap/site-v2/part-04
            .bootstrap/site-v2/part-05
            .bootstrap/site-v2/part-06
            .bootstrap/site-v2/part-07
          )
          for part in "${parts[@]}"; do
            test -f "$part"
          done
          cat "${parts[@]}" > /tmp/weibo-site.tar.xz.b64
          test "$(wc -c < /tmp/weibo-site.tar.xz.b64)" -eq 137944
          base64 --decode /tmp/weibo-site.tar.xz.b64 > /tmp/weibo-site.tar.xz
          echo "8f73b8848975129cd3817a6aaa8ff185d05ffe4db7a8e8eb8da36f3a13855a18  /tmp/weibo-site.tar.xz" | sha256sum -c -
          xz -t /tmp/weibo-site.tar.xz

          rm -rf /tmp/weibo-site
          mkdir -p /tmp/weibo-site
          tar -xJf /tmp/weibo-site.tar.xz -C /tmp/weibo-site
          project=/tmp/weibo-site/weibo-3-networks

          test -f "$project/index.html"
          test -f "$project/atlas/index.html"
          test -f "$project/atlas/app.js"
          test -f "$project/atlas/styles.css"
          test -f "$project/atlas/data/manifest.json"
          test -f "$project/atlas/data/expert.json"
          test -f "$project/atlas/data/government.json"
          test -f "$project/atlas/data/cso.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/weibo-site/weibo-3-networks/atlas/data')
          expected = {
              'expert.json': (4002, 4154),
              'government.json': (165, 200),
              'cso.json': (846, 1036),
          }
          for name, (nodes, edges) in expected.items():
              data = json.loads((root / name).read_text(encoding='utf-8'))
              assert len(data['nodes']) == nodes, (name, len(data['nodes']), nodes)
              assert len(data['edges']) == edges, (name, len(data['edges']), edges)
          print('All three network files passed structural validation.')
          PY

      - name: Publish verified site to gh-pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          project=/tmp/weibo-site/weibo-3-networks
          cd "$project"
          rm -rf .git .github .bootstrap
          touch .nojekyll

          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish simplified interactive Weibo network atlas"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
