name: Publish simplified Weibo network atlas

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/simple/**'
      - '.github/workflows/bootstrap-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-weibo-atlas
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify the prepared site
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap/simple
          mapfile -t parts < <(find .bootstrap/simple -maxdepth 1 -type f -name 'part-*' | sort)
          test "${#parts[@]}" -eq 10

          : > /tmp/weibo-project.tar.xz.b64
          for part in "${parts[@]}"; do
            if [[ "$part" == *"part-03" ]]; then
              # The original upload contains one stray trailing byte in this part.
              head -c 18000 "$part" >> /tmp/weibo-project.tar.xz.b64
            else
              cat "$part" >> /tmp/weibo-project.tar.xz.b64
            fi
          done

          test "$(wc -c < /tmp/weibo-project.tar.xz.b64)" -eq 180000
          base64 --decode /tmp/weibo-project.tar.xz.b64 > /tmp/weibo-project.tar.xz
          xz -t /tmp/weibo-project.tar.xz

          rm -rf /tmp/weibo-project
          mkdir -p /tmp/weibo-project
          tar -xJf /tmp/weibo-project.tar.xz -C /tmp/weibo-project
          project=/tmp/weibo-project/weibo-3-networks

          test -f "$project/index.html"
          test -f "$project/atlas/index.html"
          test -f "$project/atlas/app.js"
          test -f "$project/atlas/styles.css"
          test -f "$project/atlas/data/manifest.json"
          test -f "$project/atlas/data/expert.json"
          test -f "$project/atlas/data/government.json"
          test -f "$project/atlas/data/cso.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/weibo-project/weibo-3-networks/atlas/data')
          expected = {
              'expert.json': (4002, 4154),
              'government.json': (165, 200),
              'cso.json': (846, 1036),
          }
          for name, (nodes, edges) in expected.items():
              data = json.loads((root / name).read_text(encoding='utf-8'))
              assert len(data['nodes']) == nodes, (name, len(data['nodes']), nodes)
              assert len(data['edges']) == edges, (name, len(data['edges']), edges)
          print('All three network files passed structural validation.')
          PY

      - name: Publish verified site to gh-pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          project=/tmp/weibo-project/weibo-3-networks
          cd "$project"
          rm -rf .git .github .bootstrap
          touch .nojekyll

          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish simplified interactive Weibo network atlas"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
